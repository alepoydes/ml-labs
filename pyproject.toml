[project]
name = "coursekit"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2",
    "numba>=0.65,<0.69",
    "scipy>=1.15",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "pillow>=11",
    "matplotlib>=3.10",
    "filelock>=3.17",
    "marimo>=0.25.0",
]

[project.optional-dependencies]
cuda = ["torch>=2.14"]
gui = ["PySide6-Essentials>=6.8", "moderngl>=5.12"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
cpu = ["torch>=2.14"]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 92

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
