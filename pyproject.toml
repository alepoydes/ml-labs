[project]
name = "coursekit"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2", "scipy>=1.15", "scikit-learn>=1.6", "joblib>=1.4",
    "pillow>=11", "matplotlib>=3.10", "torch>=2.6", "filelock>=3.17",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 92

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
